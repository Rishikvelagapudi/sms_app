services:
  - type: web
    name: student-management-system
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py init_db && python manage.py collectstatic --noinput"
    startCommand: "gunicorn sms_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
